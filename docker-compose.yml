services:
  web:
    build: .
    container_name: lifegym_app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1

volumes:
  media_volume:
  static_volume: