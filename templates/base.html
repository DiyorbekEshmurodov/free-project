<!DOCTYPE html>
{% load static %}
<html lang="uz" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Life GYM{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

    <!-- AOS Animatsiya Kutubxonasi -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <!-- CSS Fayllar -->
    <link rel="stylesheet" href="{% static 'css/userbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/type.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>

    {% include 'userbar.html' %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- JS FAYLLAR -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script src="{% static 'js/main.js' %}?v=1.2"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
