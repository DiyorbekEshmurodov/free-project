<!DOCTYPE html>
{% load static %}
<html lang="uz" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Life GYM{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

    <style>
        /* main.js ishlatadigan o'zgaruvchilar va ranglar */
        :root[data-theme="dark"] {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --primary: #00b894;
            --primary-blue: #00b894; /* main.js ichidagi rangi uchun */
        }

        :root[data-theme="light"] {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
            --text-main: #111827;
            --text-muted: #4b5563;
            --primary: #00b894;
            --primary-blue: #00b894;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .main-container {
            max-width: 1350px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* Kartochkalar paneli uchun GRID */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .feature-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 16px;
            display: block;
        }

        .feature-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
        }
    </style>
</head>
<body>

    <header style="background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 20px 0; width: 100%;">
        <div style="max-width: 1350px; margin: 0 auto; padding: 0 30px; display: flex; justify-content: space-between; align-items: center;">

            <!-- Logo va Userbar -->
            <div style="display: flex; align-items: center; gap: 30px;">
                <a href="{% url 'home' %}" style="font-weight: 900; font-size: 1.4rem; color: var(--text-main);">
                    LIFE <span style="color: var(--primary);">GYM</span>
                </a>

                <div style="display: flex; align-items: center; gap: 10px;">
                    {% if request.user.is_authenticated %}
                        <span style="color: var(--text-main); font-weight: 600; font-size: 0.95rem;">👤 {{ request.user.username }}</span>
                        <a href="{% url 'logout_page' %}" style="background-color: #ff4b5a; color: #ffffff; padding: 6px 14px; border-radius: 8px; font-weight: bold; font-size: 0.85rem;">Chiqish</a>
                    {% endif %}
                </div>
            </div>

            <!-- Tema almashtirgich va Boshlash -->
            <div style="display: flex; align-items: center; gap: 15px;">
                <button id="theme-toggle" style="background: var(--bg-color); border: 1px solid var(--border-color); width: 45px; height: 45px; border-radius: 12px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; color: var(--text-main);">
                    ☀️
                </button>

                {% if not request.user.is_authenticated %}
                    <a href="{% url 'login_page' %}" style="background-color: var(--primary); color: #ffffff; padding: 12px 28px; border-radius: 12px; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 8px;">
                        Boshlash &rarr;
                    </a>
                {% endif %}
            </div>

        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- MAIN.JS faylingizni bog'lash -->
    <script src="{% static 'js/main.js' %}?v=1.1"></script>
</body>
</html>
