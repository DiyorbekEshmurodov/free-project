{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/ai_response.css' %}">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<div class="analysis-wrapper">
    <!-- AI javobi kartasi -->
    <div class="ai-response-card">
        <h2 class="ai-title">{{ question_data.title }}</h2>

        {% if question_data.text %}
            <div class="ai-user-text">
                "{{ question_data.text }}"
            </div>
        {% endif %}

        <div id="ai-content" class="markdown-content"></div>
    </div>

    <!-- Tugma kartaning PASTIDAN joy oladi -->
    <div class="back-btn-wrapper">
        <a href="{% url 'cards_list' section_name=section_name %}" class="back-btn">
            ← Orqaga qaytish
        </a>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const rawMarkdown = `{{ ai_result|escapejs }}`;
        if (rawMarkdown) {
            document.getElementById('ai-content').innerHTML = marked.parse(rawMarkdown);
        }
    });
</script>
{% endblock %}
