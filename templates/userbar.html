{% load static %}
<header style="background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 15px 0; width: 100%; position: relative; z-index: 100;">
    <div style="max-width: 1350px; margin: 0 auto; padding: 0 30px; display: flex; justify-content: space-between; align-items: center;">

        <!-- Logo -->
        <div style="display: flex; align-items: center; gap: 30px;">
            <a href="{% url 'index' %}" style="font-weight: 900; font-size: 1.4rem; color: var(--text-main); text-decoration: none;">
                LIFE <span style="color: var(--primary-green, #00b894);">GYM</span>
            </a>
        </div>

        <!-- O'ng taraf: Tema almashtirgich va Userbar (Dropdown) -->
        <div style="display: flex; align-items: center; gap: 20px;">
            <button id="theme-toggle" type="button" style="background: var(--bg-color); border: 1px solid var(--border-color); width: 42px; height: 42px; border-radius: 12px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; color: var(--text-main);">
                ☀️
            </button>

            {% if request.user.is_authenticated %}
                <!-- USERBAR DROPDOWN QISMI -->
                <div class="user-dropdown-wrapper" style="position: relative;">
                    <button type="button" class="userbar-btn" id="userMenuBtn" style="display: flex; align-items: center; gap: 10px; background: transparent; border: none; cursor: pointer; color: var(--text-main);">

                        <!-- AVATAR MANTIQLARI TO'G'RILANDI (userdetail) -->
                        {% if request.user.profile.avatar %}
                            <img src="{{ request.user.profile.avatar.url }}" alt="{{ request.user.username }}" class="user-avatar" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary-green, #00b894);">
                        {% else %}
                            <div class="user-avatar-placeholder" style="width: 38px; height: 38px; border-radius: 50%; background: var(--primary-green, #00b894); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold;">
                                {{ request.user.username|slice:":1"|upper }}
                            </div>
                        {% endif %}

                        <span class="user-name" style="font-weight: 600;">{{ request.user.first_name|default:request.user.username|title }}</span>
                        <span class="dropdown-arrow" style="font-size: 10px;">▼</span>
                    </button>

                    <!-- DROPDOWN MENYU -->
                    <div class="dropdown-menu" id="userDropdown" style="display: none; position: absolute; right: 0; top: 48px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; min-width: 220px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); padding: 12px; z-index: 99999;">
                        <div class="dropdown-header" style="padding-bottom: 8px;">
                            <div class="dropdown-user-title" style="font-weight: bold; color: var(--text-main);">{{ request.user.username|title }}</div>
                            <div class="dropdown-user-sub" style="font-size: 12px; color: var(--text-muted);">Fitness profil</div>
                        </div>

                        <hr class="dropdown-divider" style="border: 0; border-top: 1px solid var(--border-color); margin: 8px 0;">

                        <!-- 1. ACCOUNTS (CRUD) -->
                        <a href="{% url 'user_list' %}" class="dropdown-item" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; color: var(--text-main); text-decoration: none; border-radius: 8px; font-size: 14px;">
                            📋 <span>Profil ma'lumotlari (CRUD)</span>
                        </a>

                        <!-- 2. LOGIN & PAROL SOZLAMALARI -->
                        <a href="{% url 'profile_setup' %}" class="dropdown-item" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; color: var(--text-main); text-decoration: none; border-radius: 8px; font-size: 14px;">
                            🔒 <span>Profilni tahrirlash</span>
                        </a>

                        <hr class="dropdown-divider" style="border: 0; border-top: 1px solid var(--border-color); margin: 8px 0;">

                        <!-- 3. LOGOUT -->
                        <a href="{% url 'logout_page' %}" class="dropdown-item logout-item" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; color: #ef4444; text-decoration: none; border-radius: 8px; font-size: 14px;">
                            🚪 <span>Tizimdan chiqish</span>
                        </a>
                    </div>
                </div>
            {% else %}
                <a href="{% url 'login_page' %}" style="background-color: var(--primary-green, #00b894); color: #ffffff; padding: 10px 24px; border-radius: 12px; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 8px; text-decoration: none;">
                    Boshlash &rarr;
                </a>
            {% endif %}
        </div>

    </div>
</header>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const btn = document.getElementById('userMenuBtn');
        const dropdown = document.getElementById('userDropdown');

        if (btn && dropdown) {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (dropdown.style.display === 'none' || dropdown.style.display === '') {
                    dropdown.style.display = 'block';
                } else {
                    dropdown.style.display = 'none';
                }
            });

            document.addEventListener('click', function(e) {
                if (!dropdown.contains(e.target) && !btn.contains(e.target)) {
                    dropdown.style.display = 'none';
                }
            });
        }
    });
</script>
